# =============================================================================
# arch-boki menu.conf — user overrides
# This file is sourced by menu.sh at startup.
# Uncomment and edit any line to override the default.
# =============================================================================

# Terminal emulator to use
# TERMINAL="alacritty"

# Editor to use (opened inside a terminal)
# EDITOR="nvim"

# Browser to use
# BROWSER="firefox"

# AUR helper to use (yay or paru — auto-detected if not set)
# AUR_HELPER="yay"

# Rofi menu width
# MENU_WIDTH="40"

# Rofi theme override (full path to .rasi file)
# ROFI_THEME="${HOME}/.config/rofi/my-theme.rasi"
